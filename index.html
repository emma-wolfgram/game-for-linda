function drawSprite(ctx, matrix, palette, cx, feetY, facing, px){
  const rows=matrix.length, cols=matrix[0].length;
  ctx.save();
  ctx.translate(cx, feetY - rows*px);
  ctx.scale(facing,1);
  const xOff = -cols*px/2;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const v = matrix[r][c];
      if(v){ ctx.fillStyle = palette[v]; ctx.fillRect(xOff + c*px, r*px, px+0.5, px+0.5); }
    }
  }
  ctx.restore();
}

// soft, understated shadow beneath a sprite's feet — helps it read against
// a busy photo background without calling attention to itself
function drawShadow(ctx, cx, feetY){
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.ellipse(cx, feetY+3, 15, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ======================================================================
   LEVEL DEFINITIONS
   ====================================================================== */
// ---- physics-derived jump limits (see GRAVITY/JUMP_V/MOVE_SPEED above) ----
const MAX_JUMP_DIST = 190;   // horizontal px clearable in one full jump
const MAX_JUMP_RISE = 128;   // vertical px reachable in one full jump

function randRange(min, max){ return min + Math.random()*(max-min); }

// difficulty: 1 = easiest (World 1), increase per world for tighter margins
//
// NOTE: only two feature types now, by design — a gap is EITHER a clean jump
// (no platform at all) OR a solid-ground stretch with a floating platform
// above it. A platform never spans the x-range of a gap, so there's no more
// "platform floating over a hole with nothing under it" case.
function buildRandomLayout(width, difficulty=1){
  const gaps = [];
  const platforms = [];
  const collectibles = [];

  let x = 260;                 // clear space after spawn
  const margin = 340;          // keep goal area clear

  while (x < width - margin) {
    const roll = Math.random();

    if (roll < 0.55) {
      // clean-jump gap, no platform — sits near the max clearable distance
      const gapW = randRange(MAX_JUMP_DIST*0.6, MAX_JUMP_DIST*0.9 + difficulty*3);
      gaps.push({ x, w: gapW });
      x += gapW + randRange(160 - difficulty*4, 260 - difficulty*8);

    } else {
      // floating platform, solid ground underneath — vertical-only challenge,
      // never overlaps a gap
      platforms.push({
        x, w: randRange(60, 105),
        rise: randRange(MAX_JUMP_RISE*0.4, MAX_JUMP_RISE*0.92)
      });
      x += randRange(170, 250);
    }
  }

  let cx = 120;
  while (cx < width - 150) {
    // keep ground-level (rise 0) collectibles OUT of gaps — a coin sitting at
    // ground height over a pit is basically uncollectable
    let rise = Math.random() < 0.5 ? 0 : randRange(60, MAX_JUMP_RISE);
    if (rise === 0 && gaps.some(g => cx > g.x-20 && cx < g.x+g.w+20)) {
      rise = randRange(60, MAX_JUMP_RISE);
    }
    collectibles.push({ x: cx, rise });
    cx += randRange(130 - difficulty*3, 210 - difficulty*5);
  }

  return { gaps, platforms, collectibles };
}

// ===== WORLD 6 — FIND ME =====
// The entire floor is one continuous pit; the only way across is the chain
// of platforms. The final platform is where "me" stands, and where the
// player must land to finish.
function buildFinaleLayout(level){
  const gaps = [{ x:0, w: level.width }];
  const platforms = [];
  let x = 150;
  const margin = 210;
  while (x < level.width - margin) {
    platforms.push({ x, w: randRange(115,155), rise: randRange(40,150) });
    x += randRange(150,205);
  }
  const meRise = 70;
  platforms.push({ x: level.width-90, w:160, rise: meRise });

  const collectibles = platforms
    .filter((p,i)=> i>0 && i<platforms.length-1 && Math.random()<0.7)
    .map(p=>({ x:p.x, rise:p.rise+40 }));

  return { gaps, platforms, collectibles, meRise };
}

function buildLayoutFor(level){
  if(level.isFinale) return buildFinaleLayout(level);
  return buildRandomLayout(level.width, level.difficulty);

/* ---------------- enemies: random pool per level, scaled by difficulty ---------------- */
function generateEnemies(lvl){
  if(lvl.isFinale) return [];
  const count = 1 + Math.floor(lvl.difficulty * 0.7); // more enemies on harder worlds
  const arr = [];
  const usedSpots = [];

  for(let i=0; i<count; i++){
    const type = Math.random() < 0.5 ? 'bob' : 'walk';
    const emoji = lvl.enemyTypes[Math.floor(Math.random()*lvl.enemyTypes.length)];

    // pick an x spot that isn't too close to spawn, the goal, or another enemy
    let x, tries=0;
    do {
      x = randRange(300, lvl.width-300);
      tries++;
    } while(usedSpots.some(u=>Math.abs(u-x)<250) && tries<20);
    usedSpots.push(x);

    if(type==='bob'){
      arr.push({
        type:'bob', spawnX:x, x, rise:randRange(30,140), base:randRange(30,140),
        dir:1, invuln:0, t:0, emoji
      });
    } else {
      const spread = randRange(80,180);
      const dir = Math.random()<0.5?1:-1;
      arr.push({
        type:'walk', spawnX:x, x, xStart:x-spread/2, xEnd:x+spread/2,
        rise:0, dir, spawnDir:dir,
        speed:randRange(70,90)+lvl.difficulty*12,
        invuln:0, emoji
      });
    }
  }
  return arr;
}

function resetEnemies(){
  enemies.forEach(e=>{
    e.x = e.spawnX;
    e.invuln = 0;
    if(e.type==='bob'){ e.t = 0; e.rise = e.base; }
    else { e.dir = e.spawnDir; }
  });
}

function updateEnemies(dt){
  enemies.forEach(e=>{
    if(e.invuln>0) e.invuln -= dt;
    if(e.type==='bob'){
      e.t += dt;
      e.rise = e.base + Math.sin(e.t*2)*30;
    } else {
      e.x += e.dir*e.speed*dt;
      if(e.x>e.xEnd || e.x<e.xStart) e.dir*=-1;
    }
  });
}

/* (pixelated photo-platform rendering removed — World 6 platforms are now
   plain, and the full-background photo collage covers the "photos" ask) */

/* ======================================================================
   GAME STATE
   ====================================================================== */
let levelIdx = 0;
let totalCollected = 0;
let sessionCollected = 0;
let maxPossible = 0;
let canvas, ctx, dpr=1, viewW=800, viewH=600;
let camX=0;
let checkpointX=100;
let running=false;
let runToken=0;

function startGame(){
  document.getElementById('screen-title').style.display='none';
  document.getElementById('screen-game').classList.add('active');
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  dpr = Math.min(window.devicePixelRatio||1,2);
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  levelIdx = 0;
  sessionCollected = 0;
  maxPossible = 0;
  showIntroCard();
}
function resizeCanvas(){
  viewW=window.innerWidth; viewH=window.innerHeight;
  canvas.width=viewW*dpr; canvas.height=viewH*dpr;
  canvas.style.width=viewW+'px'; canvas.style.height=viewH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function showIntroCard(){
  const lvl = LEVELS[levelIdx];
  document.getElementById('intro-title').textContent = lvl.name + ': ' + lvl.subtitle;
  document.getElementById('intro-sub').textContent = lvl.isFinale ? 'walk until you find her.' : 'reach the flag at the end!';
  document.getElementById('intro-card').classList.add('show');
  document.getElementById('hud-level').textContent = lvl.name;
}

let level, layout, player, enemies, collected, sceneRunning, lives;
// ===== PHOTO COLLAGE BACKGROUND =====
// Fully code-generated: tiles a shuffled grid of your photos across the
// ENTIRE level width and viewport height so the background is a real collage,
// not a sparse scatter. Re-shuffles per level so the arrangement is different
// every time you replay it.
let collage=[];
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildCollage(){
  collage = [];
  if(!level.photos || level.photos.length === 0) return;

  const cellW = 190, cellH = 165;
  const cols = Math.ceil(level.width/cellW) + 2;   // +2 covers scroll edges
  const rows = Math.ceil(viewH/cellH) + 1;
  const needed = cols*rows;

  // build a long shuffled pool (re-shuffling each pass) so photos repeat
  // evenly across the grid instead of clustering
  let pool = [];
  while(pool.length < needed){ pool = pool.concat(shuffled(level.photos)); }

  let idx = 0;
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      const src = pool[idx++];
      const img = new Image();
      img.src = src;
      const w = cellW + randRange(-8,22);
      collage.push({
        img,
        x: (c-1)*cellW + randRange(-16,16),
        y: r*cellH + randRange(-12,12),
        w, h: w*0.78,
        angle: (Math.random()-0.5)*0.09,
        alpha: 0.95
      });
    }
  }
}
// ===== END PHOTO COLLAGE BACKGROUND =====

const START_LIVES = 3;

function beginLevel(){
  document.getElementById('intro-card').classList.remove('show');
  level = LEVELS[levelIdx];
  buildCollage();
  layout = buildLayoutFor(level);
  maxPossible += layout.collectibles.length; // counted once per level, not on retries
  enemies = generateEnemies(level);
  resetAttempt();
  runToken++;
  sceneRunning = true;
  setupInput();
  requestAnimationFrame(gameLoop);
}

function resetAttempt(){
  // reset player, collectibles, enemies, and lives without re-rolling the
  // level layout, so a retry gives the same level but a clean slate
  player = { x:100, y:0, vy:0, onGround:true, facing:1, walking:false, animT:0 };
  checkpointX = 100;
  collected = 0;
  camX = 0;
  lives = START_LIVES;
  resetEnemies();
  layout.collectibles.forEach(c=>c.got=false);
  document.getElementById('hud-collect').textContent = '💛 '+collected;
  document.getElementById('hud-lives').innerHTML = '<img src="pics/heart_toes.png" alt="life" class="life-icon">'.repeat(lives);
}

function retryLevel(){
  document.getElementById('retry-card').classList.remove('show');
  resetAttempt();
  runToken++;
  sceneRunning = true;
  requestAnimationFrame(gameLoop);
}

function loseLife(){
  lives--;
  document.getElementById('hud-lives').innerHTML = '<img src="pics/heart_toes.png" alt="life" class="life-icon">'.repeat(Math.max(0,lives)) + '<img src="pics/struggling.png" alt="broken heart" class="life-icon">'.repeat(START_LIVES-Math.max(0,lives));
  if(lives<=0){
    sceneRunning = false;
    document.getElementById('retry-sub').textContent = 'out of hearts, do better';
    document.getElementById('retry-card').classList.add('show');
    return true;
  }
  return false;
}

/* ---------------- input ---------------- */
const keys = { left:false, right:false, jump:false };
let inputBound=false;
function setupInput(){
  if(inputBound) return;
  inputBound=true;
  window.addEventListener('keydown', e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=true;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=true;
    if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ e.preventDefault(); keys.jump=true; }
  });
  window.addEventListener('keyup', e=>{
    if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=false;
    if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=false;
    if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W') keys.jump=false;
  });
  const bind=(id,dir)=>{
    const el=document.getElementById(id);
    const on=(e)=>{e.preventDefault(); keys[dir]=true;};
    const off=(e)=>{e.preventDefault(); keys[dir]=false;};
    el.addEventListener('touchstart',on,{passive:false});
    el.addEventListener('touchend',off,{passive:false});
    el.addEventListener('mousedown',on);
    el.addEventListener('mouseup',off);
    el.addEventListener('mouseleave',off);
  };
  bind('btn-left','left'); bind('btn-right','right'); bind('btn-jump','jump');
}

/* ---------------- physics / loop ---------------- */
const GRAVITY=1800, JUMP_V=-680, MOVE_SPEED=230;
let lastT=null;

function gameLoop(ts){
  if(!sceneRunning) return;
  if(lastT===null) lastT=ts;
  const dt=Math.min((ts-lastT)/1000,0.035);
  lastT=ts;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

function groundYBase(){ return viewH*0.74; }

function inGap(x){
  return layout.gaps.some(g=> x > g.x && x < g.x+g.w);
}
function platformAt(x){
  // returns platform if player's x within its span
  return layout.platforms.find(p=> x > p.x-p.w/2 && x < p.x+p.w/2);
}

function update(dt){
  let dx = 0;
  if(keys.left){
    dx -= 1;
    player.facing = -1;
  }
  if(keys.right){
    dx += 1;
    player.facing = 1;
  }

  player.walking = dx !== 0;

  if(player.walking){
    player.x += dx * MOVE_SPEED * dt;
    player.animT += dt;
  }

  player.x = Math.max(20, Math.min(level.width - 20, player.x));

  if(keys.jump && player.onGround){
    player.vy = JUMP_V;
    player.onGround = false;
  }

  // Gravity
  player.vy += GRAVITY * dt;
  player.y += player.vy * dt;

  // Reset each frame. It will become true only if we land.
  player.onGround = false;

  const gY = groundYBase();

  // Check for a platform under the player
  const plat = platformAt(player.x);

  // Default standing position is the ground
  let standY = gY;

  // If there is a platform, let it become the standing surface
  if (plat) {
    const platTopY = gY - plat.rise;

    // Landing on top of the platform only
    if (
      player.vy >= 0 &&
      player.y >= platTopY &&
      player.y - platTopY < 40
    ) {
      standY = platTopY;
    }
  }

  // Stand on either ground or platform
  if (!inGap(player.x) || standY !== gY) {
    if (player.y >= standY) {
      player.y = standY;
      player.vy = 0;
      player.onGround = true;
      player.falling = false;
    }
  } else {
    // Falling into a gap
    if (player.y > gY + 220 && !player.falling) {
      player.falling = true;

      const dead = loseLife();

      if (!dead) {
        player.x = checkpointX;
        player.y = gY;
        player.vy = 0;
        player.onGround = true;
        player.falling = false;
      } else {
        return;
      }
    }
  }

  // Update checkpoint only while on solid ground
  if(player.onGround && !inGap(player.x)){
    checkpointX = Math.max(checkpointX, player.x - 40);
  }

  // Update enemies
  updateEnemies(dt);

  for(const e of enemies){
    const ey = gY - e.rise;

    if(Math.hypot(player.x - e.x, (player.y - 17) - ey) < 34 && !e.invuln){
      e.invuln = 1.1;

      const dead = loseLife();

      if(dead) return;

      // Small knockback
      player.x -= player.facing * 60;
      break;
    }
  }

  // Collectibles
  layout.collectibles.forEach(c => {
    if(c.got) return;

    const cy = gY - c.rise - 14;

    if(Math.hypot(player.x - c.x, (player.y - 17) - cy) < 26){
      c.got = true;
      collected++;
      totalCollected++;

      document.getElementById('hud-collect').textContent =
        '💛 ' + collected;
    }
  });

  // Goal
  const goalX = level.width - 120;

  if(player.x >= goalX){
    onReachGoal();
  }

  // Camera
  camX = Math.max(
    0,
    Math.min(level.width - viewW, player.x - viewW * 0.4)
  );
}

function onReachGoal(){
  sceneRunning=false;
  sessionCollected += collected; // banked permanently — retries never double-count this
  if(level.isFinale){
    document.getElementById('found-card').classList.add('show');
  } else {
    document.getElementById('clear-sub').textContent = 'Collected '+collected+' 💛 in '+level.subtitle;
    document.getElementById('clear-card').classList.add('show');
  }
}
function nextLevel(){
  document.getElementById('clear-card').classList.remove('show');
  levelIdx++;
  showIntroCard();
}
function goFinaleEpilogue(){
  document.getElementById('found-card').classList.remove('show');
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-finale').classList.add('active');
  document.getElementById('final-score').textContent = '💛 '+sessionCollected+' / '+maxPossible+' COLLECTED';
  startSlideshow();
  burstConfetti();
}

/* ---------------- draw ---------------- */
function draw(){
  const gY = groundYBase();
  ctx.clearRect(0,0,viewW,viewH);

  // sky
  const grad = ctx.createLinearGradient(0,0,0,viewH);
  grad.addColorStop(0, level.sky[0]); grad.addColorStop(1, level.sky[1]);
  ctx.fillStyle=grad; ctx.fillRect(0,0,viewW,viewH);

  // ===== PHOTO COLLAGE BACKGROUND =====
  ctx.save();
  collage.forEach(photo=>{
    // CRITICAL: a failed/broken image is still "complete" — drawImage on it
    // throws and silently kills the rest of the frame. Always guard on
    // naturalWidth too, and never let one bad path break the game.
    if(!photo.img.complete || photo.img.naturalWidth===0) return;
    try{
      ctx.save();
      ctx.translate(photo.x - camX*0.7, photo.y);
      ctx.rotate(photo.angle);
      ctx.globalAlpha = photo.alpha;
      ctx.fillStyle = '#fbf6ee';
      ctx.fillRect(-4,-4, photo.w+8, photo.h+8);
      ctx.drawImage(photo.img, 0, 0, photo.w, photo.h);
      ctx.restore();
    } catch(err){ /* skip this tile, keep the frame alive */ }
  });
  ctx.globalAlpha = 1;
  ctx.restore();

  // gentle scrim so ground/player/UI stay readable over a busy photo backdrop
  ctx.fillStyle = 'rgba(10,8,20,0.22)';
  ctx.fillRect(0,0,viewW,viewH);
  // ===== END PHOTO COLLAGE BACKGROUND =====

  ctx.save();
  ctx.translate(-camX,0);

  // parallax decor
  const decorSeed = 37;
  ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<18;i++){
    const dx = (i*decorSeed*7)%level.width;
    const dy = 40 + (i*53)%(gY-100);
    ctx.globalAlpha=0.5;
    ctx.fillText(level.decor[i%level.decor.length], dx, dy);
  }
  ctx.globalAlpha=1;

  // ground with gaps
  ctx.fillStyle = level.ground;
  if(layout.gaps.length===0){
    ctx.fillRect(0, gY, level.width, viewH-gY+40);
  } else {
    let segStart=0;
    const sorted = layout.gaps.slice().sort((a,b)=>a.x-b.x);
    sorted.forEach(g=>{
      ctx.fillRect(segStart, gY, g.x-segStart, viewH-gY+40);
      segStart = g.x+g.w;
    });
    ctx.fillRect(segStart, gY, level.width-segStart, viewH-gY+40);
  }
  ctx.fillStyle = level.groundTop;
  if(layout.gaps.length===0){ ctx.fillRect(0,gY,level.width,6); }
  else {
    let segStart=0;
    const sorted = layout.gaps.slice().sort((a,b)=>a.x-b.x);
    sorted.forEach(g=>{ ctx.fillRect(segStart,gY,g.x-segStart,6); segStart=g.x+g.w; });
    ctx.fillRect(segStart,gY,level.width-segStart,6);
  }

  // platforms — plain style for every level now (World 6's "photos" ask is
  // handled by the full background collage, not per-platform textures)
  layout.platforms.forEach(p=>{
    const topY = gY - p.rise;
    ctx.fillStyle = level.groundTop;
    ctx.fillRect(p.x-p.w/2, topY, p.w, 20);
    ctx.fillStyle = level.ground;
    ctx.fillRect(p.x-p.w/2, topY+20, p.w, 10);
  });

  // collectibles
  ctx.font='24px sans-serif';
  layout.collectibles.forEach(c=>{
    if(c.got) return;
    ctx.fillText(level.collectEmoji, c.x, gY-c.rise-14);
  });

  // enemies
  ctx.font='40px sans-serif';
  enemies.forEach(e=>{
    drawShadow(ctx, e.x, gY-e.rise);
    ctx.fillText(e.emoji, e.x, gY-e.rise-20);
  });

  // goal
  if(level.isFinale){
    const meX = level.width-90, meY = gY-(layout.meRise||0);
    // cute little glow backdrop for the reunion moment
    const glow = ctx.createRadialGradient(meX, meY-45, 5, meX, meY-45, 95);
    glow.addColorStop(0, 'rgba(246,209,134,0.55)');
    glow.addColorStop(1, 'rgba(246,209,134,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(meX, meY-45, 95, 0, Math.PI*2); ctx.fill();
    // a few sparkles/hearts floating around
    ctx.font='16px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const t2 = performance.now()/600;
    [[-58,-78,'✨',0],[52,-92,'💛',1],[-42,-24,'✨',2],[58,-30,'💛',3]].forEach(([dx,dy,em,ph])=>{
      const bob = Math.sin(t2+ph)*4;
      ctx.fillText(em, meX+dx, meY+dy+bob);
    });
    // "me" stands on the final platform, not on the (nonexistent) ground
    drawShadow(ctx, meX, meY);
    drawSprite(ctx, FRAME_ME, PALETTE_ME, meX, meY, 1, 4);
  } else {
    // pole
    ctx.fillStyle='#F8FF00';
    ctx.fillRect(level.width-121, gY-140, 9, 140);
    ctx.fillStyle='#F8FF00';
    ctx.fillRect(level.width-121, gY-140, 9, 6);
    // flag — bold, outlined, high-contrast
    ctx.beginPath();
    ctx.moveTo(level.width-112, gY-140);
    ctx.lineTo(level.width-72, gY-125);
    ctx.lineTo(level.width-112, gY-110);
    ctx.closePath();
    ctx.fillStyle='#FA002E';
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle='#F8FF00';
    ctx.stroke();
  }

  // player
  const frame = !player.onGround ? FRAME_JUMP : (player.walking ? (Math.floor(player.animT*8)%2===0?FRAME_WALK_A:FRAME_WALK_B) : FRAME_STAND);
  drawShadow(ctx, player.x, player.y);
  drawSprite(ctx, frame, PALETTE, player.x, player.y, player.facing, 4);

  ctx.restore();
}

/* ======================================================================
   SLIDESHOW + CONFETTI (epilogue)
   ====================================================================== */
const SLIDES = [
  {bg:"url('pics/aqua.jpg') center/cover", cap:'Aquarium, date one'},
  {bg:"url('pics/ice.jpg') center/cover", cap:'Ice skating, date two'},
  {bg:"url('pics/jt.jpg') center/cover", cap:'Joshua Tree'},
  {bg:"url('pics/beach.jpg') center/cover", cap:'Beach days'},
  {bg:"url('pics/dallas.jpg') center/cover", cap:'Dallas visit'},
  {bg:"url('pics/house.png') center/cover", cap:'Our Minecraft world'},
  {bg:"url('pics/couch.jpg') center/cover", cap:'Dinners & movie nights'},
  {bg:"url('pics/one_year.jpg') center/cover", cap:'Us, one year in'},
  {bg:"url('pics/photostrip.png') center/cover", cap:'I LOVE YOU'}
];
let slideIdx=0, slideTimer=null;
function buildSlideshow(){
  const wrap=document.getElementById('slideshow'); wrap.innerHTML='';
  const dots=document.getElementById('dots'); dots.innerHTML='';
  SLIDES.forEach(s=>{
    const d=document.createElement('div'); d.className='slide'; d.style.background=s.bg;
    d.innerHTML=`<div class="cap">${s.cap}</div>`;
    wrap.appendChild(d);
    const dot=document.createElement('div'); dot.className='dot'; dots.appendChild(dot);
  });
}
function renderSlide(){
  document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active', i===slideIdx));
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on', i===slideIdx));
}
function shiftSlide(dir){ slideIdx=(slideIdx+dir+SLIDES.length)%SLIDES.length; renderSlide(); resetTimer(); }
function resetTimer(){ clearInterval(slideTimer); slideTimer=setInterval(()=>{ slideIdx=(slideIdx+1)%SLIDES.length; renderSlide(); }, 3200); }
function startSlideshow(){ if(!document.getElementById('slideshow').childElementCount) buildSlideshow(); slideIdx=0; renderSlide(); resetTimer(); }

const confettiCanvas = document.getElementById('confetti');
const cctx = confettiCanvas.getContext('2d');
function resizeConfetti(){ confettiCanvas.width=innerWidth; confettiCanvas.height=innerHeight; }
resizeConfetti(); window.addEventListener('resize', resizeConfetti);
function burstConfetti(){
  const colors=['#f2966b','#f6d186','#6fcfc0','#e79bb0','#fbf6ee'];
  const particles=Array.from({length:90},()=>({
    x:confettiCanvas.width/2, y:confettiCanvas.height*0.35,
    vx:(Math.random()-0.5)*10, vy:Math.random()*-8-2,
    size:Math.random()*6+4, color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*360, vr:(Math.random()-0.5)*10, life:0
  }));
  let frame=0;
  function tick(){
    cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    frame++;
    particles.forEach(p=>{
      p.vy+=0.25; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
      cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
      cctx.fillStyle=p.color; cctx.globalAlpha=Math.max(0,1-p.life/90);
      cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      cctx.restore();
    });
    if(frame<100) requestAnimationFrame(tick); else cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  }
  tick();
}
